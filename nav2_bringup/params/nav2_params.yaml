amcl:
  ros__parameters:
    use_sim_time: True
    global_frame_id: map
    robot_base_frame_id: base_footprint
    odom_frame_id: odom
    scan_topic: scan

    initial_pose_x: 0.0
    initial_pose_y: 0.0

    # 粒子滤波调整
    max_particles: 3000 # 适当增加粒子数，平衡精度与计算量
    min_particles: 1000 # 防止粒子数过少导致定位丢失
    resample_interval: 5 # 减少重采样频率，避免过早收敛
    pf_err: 0.03 # 更严格的收敛阈值
    pf_z: 0.95 # 降低重采样随机性

    # 激光传感器模型优化
    laser_model_type: "likelihood_field"
    z_hit: 0.75 # 提高有效测量的权重
    z_rand: 0.25 # 降低随机噪声的权重
    sigma_hit: 0.15 # 缩小高斯模型标准差
    laser_likelihood_max_dist: 1.5 # 限制最大匹配距离

    # 运动模型调整
    alpha1: 0.15 # 平移噪声（X方向）
    alpha2: 0.15 # 平移噪声（Y方向）
    alpha3: 0.10 # 旋转噪声
    alpha4: 0.10 # 平移导致的旋转噪声
    update_min_d: 0.1 # 减小位移更新阈值（原0.25）
    update_min_a: 0.15 # 减小角度更新阈值（原0.2）

    # 鲁棒性增强
    transform_tolerance: 0.5 # 降低TF延迟容忍度
    recovery_alpha_slow: 0.001 # 慢速恢复滤波器
    recovery_alpha_fast: 0.1 # 快速恢复滤波器
    do_beamskip: true # 启用光束跳跃检测
    beam_skip_distance: 1.0 # 动态障碍物跳过阈值

